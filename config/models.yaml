# 端点注册表。只记录与 default.yaml 不同的条目。
#
# 路径口径：本地 `path` 写**项目根相对路径**（用 / 分隔，基准是仓库根目录），
# 不写盘符。目录改名/换盘/拷到别的机器时绝对路径会立刻失效。项目外的
# 模型可以用 `../` 往上走，也可以在界面里改。
#
# providers:
#   <名字>:                     小写字母数字，2-24 字符
#     kind: local | openai      local 表示模型带 .gguf、本机能起
#     autostart: true           可选；后台启动时自动拉起默认模型
#     base_url: http://...      OpenAI 兼容地址，末尾到 /v1
#     model: <默认模型 id>
#     api_key_env: <变量名>      可选；密钥也可以只放界面里
#     models:
#       - id: <发给接口的 model 字段>
#         path: data/models/x.gguf  本地 gguf（相对项目根）；有这个才能点「启动」
#         port: 8090              本机监听端口；不写就自动挑
#         context: 4096           上下文长度
#         max_output: 1024        单次输出上限
#
# roles: 哪个端点+模型干哪件事，值写成 `端点::模型`
#   translate: local::qwen2.5-3b -- 翻译用
#   generate:  local::qwen2.5-3b -- 生成答案用

deleted: []
providers:
  siliconflow:
    base_url: https://api.siliconflow.cn/v1
    model: Qwen/Qwen2.5-7B-Instruct
    kind: openai
    models:
    - id: Qwen/Qwen2.5-7B-Instruct
      alias: ''
  local:
    base_url: http://127.0.0.1:8097/v1
    model: Qwen2.5-7B-Instruct-Q4_K_M
    kind: local
    autostart: true
    models:
    - id: Qwen2.5-7B-Instruct-Q4_K_M
      alias: ''
      context: 4096
      path: ../../llamafactory/models/lmstudio-ai/Qwen2.5-7B-Instruct-GGUF/Qwen2.5-7B-Instruct-Q4_K_M.gguf
      port: 8097
    - id: Qwen-3b-doctor-weiyi-bf16
      alias: ''
      context: 4096
      path: ../../llamafactory/models/lmstudio-ai/Qwen-3b-doctor-weiyi-bf16/Qwen-3b-doctor-weiyi-bf16.gguf
      port: 8090
  deepseek:
    base_url: https://api.deepseek.com
    model: deepseek-flash
    kind: openai
    models:
    - id: deepseek-flash
      alias: ''
