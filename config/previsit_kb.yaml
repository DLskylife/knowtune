# 预问诊知识库（2026-11-03）
#
# RAG 的"语料"就在这个文件里：按**症状域**组织，每个域下面按**槽位**给出
# 两条东西——
#   text：这一步要问什么、为什么要问（喂给大模型的"小抄"）
#   ask ：一句现成的问法（模型不可用时直接发给患者，模型可用时作为改写蓝本）
#
# 为什么分成"域 × 槽位"而不是一个平铺的知识列表：
#   主诉是"咳嗽"的患者，被问"疼痛有没有从脐周转移到右下腹"是荒谬的。
#   域决定问哪些槽位、每个槽位怎么问，这才是预问诊而不是背书。
#
# 加知识只需要在这里加一个域或一条 entry，不用改代码。
# 域的 keywords 同时用于**识别主诉属于哪个域**（命中最多者胜），
# 所以要写患者真的会说的口语词，不要只写术语。
#
# 免责：本文件是问诊流程知识（该问什么），不是诊断标准，不含治疗建议。

version: 1

# 所有域都没命中时的兜底域（"我不舒服""浑身难受"这类模糊主诉）
default_domain: general

domains:
  # ================================================================ 腹痛
  - key: abd
    label: 腹痛
    dept: 消化内科
    keywords: ["肚子疼", "肚子痛", "腹痛", "胃疼", "胃痛", "肚子不舒服", "腹部不适",
               "肚子", "胃部", "腹疼", "拉肚子疼", "绞痛", "胀气疼"]
    slots: [site, nature, duration, companions, migration]
    slot_hints:
      site: "上腹 / 脐周 / 右下腹 / 左下腹 / 全腹，具体指哪个位置"
      nature: "绞痛 / 胀痛 / 刺痛 / 隐痛 / 烧灼感 / 刀割样"
    entries:
      - slot: site
        keywords: ["部位", "哪里", "位置", "哪边"]
        text: "疼痛部位是分诊的第一依据：右上腹多为胆囊、肝脏；中上腹多为胃、十二指肠、胰腺；左上腹为脾、胰尾；脐周多为小肠或阑尾炎早期；右下腹为阑尾、回盲部、女性右侧附件；左下腹为乙状结肠、女性左侧附件；全腹弥漫见于弥漫性腹膜炎或肠梗阻晚期。"
        ask: "您能指一下具体是哪个位置疼吗？比如上腹、肚脐周围、右下腹，还是整个肚子都疼？"
      - slot: site
        keywords: ["说不清", "到处", "游走", "不固定"]
        text: "疼痛部位游走不定多见于功能性胃肠病或肠易激综合征；固定在一点且进行性加重，需排除器质性病变。"
        ask: "这个疼是一直固定在同一个地方，还是会跑来跑去？"
      - slot: nature
        keywords: ["性质", "怎么疼", "什么感觉", "绞痛", "胀痛", "刺痛", "隐痛"]
        text: "疼痛性质提示病变类型：阵发性绞痛多为空腔脏器痉挛（肠梗阻、胆绞痛、肾绞痛）；胀痛多为胀气或梗阻；烧灼样痛提示胃食管反流或消化性溃疡；刀割样、撕裂样剧痛需警惕消化道穿孔；钻顶样痛见于胆道蛔虫或胆绞痛。"
        ask: "疼起来是什么感觉？是一阵阵拧着疼、胀胀地疼、烧灼感，还是像刀割一样？"
      - slot: duration
        keywords: ["多久", "持续", "时间", "几小时", "几天"]
        text: "起病急缓决定风险等级：数分钟内突发剧痛见于消化道穿孔、肠系膜血管栓塞、腹主动脉瘤破裂；数小时渐进加重见于阑尾炎、胆囊炎、胰腺炎；数周至数月的慢性腹痛多为功能性或炎症性肠病。"
        ask: "这个疼是从什么时候开始的？大概几个小时、几天，还是已经好几周了？"
      - slot: companions
        keywords: ["伴随", "恶心", "呕吐", "发热", "腹泻", "黑便"]
        text: "伴随症状是鉴别的关键：伴恶心呕吐发热提示感染或梗阻；伴黄疸提示胆道疾病；伴腹泻或便秘提示肠道病变；伴黑便呕血提示消化道出血；伴尿频尿痛提示泌尿系结石或感染；女性伴阴道出血需排除妇科急症。"
        ask: "除了肚子疼，还有没有恶心想吐、发烧、拉肚子、大便发黑，或者小便不舒服？"
      - slot: migration
        keywords: ["转移", "脐周", "右下", "阑尾", "一开始"]
        text: "转移性右下腹痛是急性阑尾炎的典型表现：疼痛先位于脐周或上腹，数小时后转移并固定于右下腹，常伴食欲减退和低热。胆绞痛可放射至右肩背，胰腺炎常向腰背部放射。"
        ask: "疼的位置变过吗？比如一开始在肚脐周围，后来固定到右下腹了？"

  # ================================================================ 胸痛
  - key: chest
    label: 胸痛
    dept: 心内科
    keywords: ["胸痛", "胸口疼", "胸口痛", "心口疼", "心口痛", "胸闷", "胸口闷",
               "胸前", "胸口", "心脏疼", "胸骨后", "压着疼"]
    slots: [site, nature, duration, trigger, companions]
    slot_hints:
      nature: "压榨样 / 闷痛 / 刺痛 / 撕裂样 / 烧灼感"
      trigger: "活动、情绪、深呼吸、体位是否诱发或加重"
    entries:
      - slot: site
        keywords: ["部位", "哪里", "放射", "肩膀", "胳膊", "后背"]
        text: "胸痛部位与放射方向提示病因：胸骨后压榨感向左肩、左臂内侧、下颌放射，高度提示心肌缺血；撕裂样剧痛从前胸放射至后背，需警惕主动脉夹层；一侧胸痛沿肋间分布、随呼吸加重，多见于胸膜炎或肋间神经痛。"
        ask: "疼的具体位置在哪？是胸口正中、偏左，还是某一侧？会不会串到肩膀、胳膊或者后背？"
      - slot: nature
        keywords: ["性质", "怎么疼", "压榨", "闷", "刺痛", "撕裂"]
        text: "压榨样、闷胀样、紧缩感多见于心绞痛或心肌梗死；刀割样、撕裂样见于主动脉夹层；针刺样锐痛且与呼吸体位相关多为胸膜或胸壁来源；烧灼样伴反酸提示胃食管反流。"
        ask: "这种疼是怎么个疼法？像被压着、闷闷的，还是针刺样、撕裂样，或者烧灼感？"
      - slot: duration
        keywords: ["多久", "持续", "几分钟", "时间"]
        text: "心绞痛多持续 3-5 分钟、休息或含服硝酸甘油可缓解；持续超过 20 分钟不缓解需高度警惕急性心肌梗死；突发撕裂样剧痛从一开始就达到高峰，提示主动脉夹层。"
        ask: "这次疼了多久了？是一直疼不缓解，还是一阵一阵的、几分钟能过去？"
      - slot: trigger
        keywords: ["诱因", "活动", "走路", "爬楼", "深呼吸", "缓解"]
        text: "诱因与缓解方式：活动、情绪激动、饱餐后发作、休息后缓解支持心绞痛；深呼吸、咳嗽、翻身时加重支持胸膜或胸壁疾病；进食后或平卧时加重、站立后减轻提示反流。"
        ask: "什么情况下会诱发或者加重？比如走路爬楼时、深呼吸时，还是躺下的时候？休息一会儿能缓解吗？"
      - slot: companions
        keywords: ["伴随", "出汗", "气短", "晕", "恶心"]
        text: "伴大汗淋漓、恶心、濒死感提示急性冠脉综合征；伴呼吸困难、咯血需排除肺栓塞；伴发热咳嗽提示肺炎或心包炎；伴晕厥提示血流动力学不稳定。"
        ask: "疼的时候有没有出汗、喘不上气、心慌、头晕，或者恶心想吐？"

  # ================================================================ 头痛
  - key: head
    label: 头痛
    dept: 神经内科
    keywords: ["头疼", "头痛", "脑袋疼", "偏头痛", "头胀", "太阳穴疼", "后脑勺疼"]
    slots: [site, nature, duration, trigger, companions]
    slot_hints:
      nature: "跳痛 / 紧箍样 / 胀痛 / 电击样 / 爆炸样"
    entries:
      - slot: site
        keywords: ["部位", "哪里", "一侧", "两侧", "后脑"]
        text: "单侧搏动性头痛多见于偏头痛；双侧紧箍样、压迫样头痛多见于紧张型头痛；枕部或后颈部疼痛需注意血压和颈椎问题；眶周疼痛伴视力变化需排除青光眼。"
        ask: "头疼的位置在哪？是一侧太阳穴跳着疼、整个头箍着疼，还是后脑勺疼？"
      - slot: nature
        keywords: ["性质", "怎么疼", "跳", "箍", "电击", "爆炸"]
        text: "搏动性（跳痛）提示血管性头痛；紧箍样、压迫样提示紧张型头痛；电击样短促剧痛需考虑三叉神经痛；爆炸样、雷击样剧痛（数秒内达到高峰）必须排除蛛网膜下腔出血。"
        ask: "疼起来是跳着疼、像被箍着，还是像电击一样一下子就来了？"
      - slot: duration
        keywords: ["多久", "突然", "持续", "几天"]
        text: "突发雷击样剧痛（1 分钟内达到高峰）是蛛网膜下腔出血的典型表现，属急症；反复发作数小时至 3 天、间歇期完全正常多见于偏头痛；持续数周每日发作多为紧张型头痛或药物过量性头痛。"
        ask: "这次头疼是突然一下就疼到最厉害，还是慢慢加重的？到现在持续多久了？"
      - slot: trigger
        keywords: ["诱因", "弯腰", "咳嗽", "睡眠", "月经", "劳累"]
        text: "体位改变、咳嗽、用力时加重提示颅内压增高；月经期前后发作提示激素相关偏头痛；睡眠不足、劳累、特定食物（红酒、奶酪）可诱发偏头痛；长期过量使用止痛药可致药物过量性头痛。"
        ask: "有没有什么情况会让头疼加重？比如弯腰、咳嗽、用力的时候，或者跟睡眠、月经有关系？"
      - slot: companions
        keywords: ["伴随", "恶心", "呕吐", "怕光", "视物", "无力"]
        text: "伴喷射性呕吐、视物模糊、肢体无力、言语不清提示颅内病变；伴发热、颈项强直需排除脑膜炎；伴畏光畏声、视觉先兆（闪光、暗点）支持偏头痛。"
        ask: "头疼的时候有没有恶心想吐、怕光怕吵、看东西不清楚，或者手脚发麻没力气？"

  # ================================================================ 发热
  - key: fever
    label: 发热
    dept: 发热门诊
    keywords: ["发烧", "发热", "烧了", "低烧", "高烧", "体温高", "烧到"]
    slots: [temperature, duration, pattern, companions, history]
    slot_hints:
      temperature: "最高体温多少、量的是哪个部位"
      pattern: "一直高还是忽高忽低"
    entries:
      - slot: temperature
        keywords: ["多少度", "体温", "几度"]
        text: "体温数值与测量方式是判断严重程度的基础：腋温≥37.3℃ 为发热，≥39℃ 为高热。老年人、免疫抑制患者可能体温不高但病情重，不能只看数字。"
        ask: "最高烧到多少度？量的是腋下、口腔还是额头？"
      - slot: duration
        keywords: ["几天", "多久", "持续"]
        text: "发热病程分三类：3 周以内为急性发热，多为感染；2-3 周以上不明原因发热需系统排查感染、结缔组织病、肿瘤。"
        ask: "烧了几天了？是一直烧还是断断续续？"
      - slot: pattern
        keywords: ["热型", "忽高忽低", "规律", "什么时候烧"]
        text: "热型有助于鉴别：稽留热（持续高热、日差<1℃）见于伤寒、肺炎；弛张热（日差>1℃）见于败血症、化脓性感染；间歇热（发热期与正常期交替）见于疟疾；午后低热伴盗汗需排查结核。"
        ask: "一天里体温是怎么变化的？一直高着，还是忽高忽低、有时候能降到正常？"
      - slot: companions
        keywords: ["伴随", "咳嗽", "嗓子", "拉肚子", "疹子", "小便"]
        text: "伴随症状提供定位线索：伴咳嗽咳痰提示呼吸道感染；伴尿频尿痛提示泌尿系感染；伴腹泻提示肠道感染；伴皮疹需排查出疹性疾病；伴关节痛需考虑风湿免疫病。"
        ask: "发烧的时候还有别的不舒服吗？比如咳嗽、嗓子疼、拉肚子、小便疼，或者身上起疹子？"
      - slot: history
        keywords: ["接触", "旅行", "用药", "手术"]
        text: "需询问流行病学史与用药史：近期旅行、接触发热病人、动物接触、不洁饮食；近期使用抗生素、激素、免疫抑制剂；有无植入物或手术史。这些直接决定要排查哪些病原。"
        ask: "最近有没有出远门、接触过生病的人或动物？这段时间有没有吃什么药？"

  # ================================================================ 咳嗽
  - key: cough
    label: 咳嗽
    dept: 呼吸内科
    keywords: ["咳嗽", "咳痰", "干咳", "老咳", "咳得", "嗓子痒咳", "痰多", "咳血"]
    slots: [duration, nature, trigger, companions, history]
    slot_hints:
      duration: "几天 / 几周 / 几个月（3 周和 8 周是分界线）"
      nature: "干咳还是有痰，痰的颜色和量"
    entries:
      - slot: duration
        keywords: ["多久", "几天", "几周", "几个月"]
        text: "按病程分：少于 3 周为急性咳嗽（多为上呼吸道感染）；3-8 周为亚急性（感染后咳嗽、百日咳）；超过 8 周为慢性咳嗽（咳嗽变异性哮喘、上气道咳嗽综合征、胃食管反流、嗜酸粒细胞性支气管炎）。"
        ask: "咳嗽多久了？是这几天刚开始，还是已经好几周了？"
      - slot: nature
        keywords: ["干咳", "痰", "颜色", "有没有痰"]
        text: "干咳无痰多见于病毒感染早期、咳嗽变异性哮喘、反流、ACEI 类降压药副作用；咳黄脓痰提示细菌感染；大量脓臭痰需考虑支气管扩张；痰中带血需排除肺结核、肿瘤、支气管扩张。"
        ask: "是干咳没有痰，还是有痰？痰是什么颜色的，多不多？"
      - slot: trigger
        keywords: ["晚上", "夜里", "冷空气", "躺下", "运动"]
        text: "夜间或凌晨加重的咳嗽提示咳嗽变异性哮喘或心衰；冷空气、烟雾、异味诱发提示气道高反应性；进食后或平卧加重提示胃食管反流；运动后发作提示运动性哮喘。"
        ask: "什么时候咳得厉害？晚上躺下、早上起来，还是一吹冷空气就咳？"
      - slot: companions
        keywords: ["伴随", "发烧", "胸痛", "气短", "盗汗", "反酸"]
        text: "伴发热提示感染；伴胸痛提示胸膜炎或剧烈咳嗽致肌肉劳损；伴气短、喘息提示气道痉挛或心功能不全；伴盗汗、消瘦、午后低热需排查肺结核；伴反酸烧心提示反流性咳嗽。"
        ask: "咳嗽的时候有没有发烧、胸口疼、喘不上气，或者反酸烧心？"
      - slot: history
        keywords: ["抽烟", "吸烟", "职业", "过敏", "哮喘", "降压药"]
        text: "询问吸烟史（包年）、职业粉尘接触、过敏史、近期是否开始服用 ACEI 类降压药（可引起干咳）、既往哮喘或慢阻肺病史。"
        ask: "您平时抽烟吗？有没有哮喘、鼻炎，或者高血压在吃什么药？"

  # ================================================================ 呼吸困难
  - key: dyspnea
    label: 气短
    dept: 呼吸内科
    keywords: ["喘不上气", "呼吸困难", "气短", "喘", "憋气", "胸闷气短", "吸不上气", "喘不动"]
    slots: [duration, trigger, nature, companions, history]
    entries:
      - slot: duration
        keywords: ["多久", "突然", "慢慢"]
        text: "突发呼吸困难（数分钟至数小时）需立即排除肺栓塞、气胸、急性左心衰、气道异物；渐进性加重的呼吸困难多见于慢阻肺、间质性肺病、贫血、心功能不全。"
        ask: "喘不上气是突然发生的，还是这段时间慢慢加重的？"
      - slot: trigger
        keywords: ["活动", "躺", "休息", "走路", "爬楼", "夜间"]
        text: "劳力性呼吸困难按活动耐量分级；端坐呼吸、夜间阵发性呼吸困难提示左心衰；平卧加重、坐起减轻也见于心包积液；接触过敏原后发作提示哮喘；长期卧床或术后突发提示肺栓塞。"
        ask: "什么情况下会觉得气不够用？走路爬楼时、躺平的时候，还是休息时也喘？"
      - slot: nature
        keywords: ["吸气", "呼气", "哨子", "哮鸣"]
        text: "吸气性呼吸困难伴喉鸣提示上气道梗阻；呼气性呼吸困难伴哮鸣音提示下气道阻塞（哮喘、慢阻肺）；混合性见于心衰、肺纤维化。"
        ask: "是觉得吸不进气，还是呼不出去？有没有听到自己喘气时有哨子一样的声音？"
      - slot: companions
        keywords: ["伴随", "胸痛", "咳", "腿肿", "发烧"]
        text: "伴胸痛需排除肺栓塞、气胸、心梗；伴咳嗽咳粉红色泡沫痰提示急性左心衰；伴单侧下肢肿胀疼痛提示深静脉血栓；伴发热提示肺炎。"
        ask: "喘的时候有没有胸口疼、咳嗽、腿肿，或者发烧？"
      - slot: history
        keywords: ["哮喘", "慢阻肺", "心脏病", "手术", "坐车", "飞机"]
        text: "既往哮喘、慢阻肺、冠心病、心衰、静脉血栓病史，以及吸烟史、近期手术或长途旅行（超过 4 小时）都会显著改变判断优先级。"
        ask: "以前有没有哮喘、慢阻肺、心脏病？最近做过手术，或者长时间坐车坐飞机吗？"

  # ================================================================ 头晕 / 眩晕
  - key: dizzy
    label: 头晕
    dept: 神经内科
    keywords: ["头晕", "眩晕", "晕", "天旋地转", "头昏", "站起来发晕", "晕乎乎", "眼前发黑"]
    slots: [nature, duration, trigger, companions, history]
    slot_hints:
      nature: "天旋地转（眩晕）/ 昏沉（头昏）/ 眼前发黑要晕倒"
    entries:
      - slot: nature
        keywords: ["哪种晕", "天旋地转", "头昏", "发黑", "什么感觉"]
        text: "先分清三种「晕」：眩晕是自身或环境在旋转（前庭系统）；头昏是昏沉、头重脚轻（全身性疾病、贫血、血压异常）；晕厥前状态是眼前发黑、快要晕倒（脑供血不足、心律失常）。三者病因完全不同。"
        ask: "您说的晕是哪一种：是天旋地转，还是头昏昏沉沉的，或者眼前发黑快要晕倒？"
      - slot: duration
        keywords: ["多久", "几秒", "几分钟", "几小时"]
        text: "眩晕持续数秒、与翻身转头相关，多为良性阵发性位置性眩晕（耳石症）；持续数分钟至数小时伴耳鸣听力下降，多为梅尼埃病；持续数天且伴走路不稳、复视、言语不清，需警惕后循环卒中。"
        ask: "晕一次能持续多久？几秒钟、几分钟，还是好几个小时都不好？"
      - slot: trigger
        keywords: ["诱因", "起床", "翻身", "转头", "站起来"]
        text: "体位改变（起床、翻身、抬头）诱发提示耳石症；转头或颈部活动诱发提示椎动脉供血不足或颈性眩晕；情绪紧张、闷热环境诱发多为血管迷走性；站立时加重、平卧缓解提示体位性低血压。"
        ask: "什么动作会诱发？比如起床、翻身、抬头的时候会不会突然晕起来？"
      - slot: companions
        keywords: ["伴随", "耳鸣", "恶心", "重影", "说话", "无力"]
        text: "伴耳鸣、听力下降提示耳源性；伴恶心呕吐出汗提示前庭或迷走反应；伴复视、构音障碍、吞咽困难、单侧肢体无力或行走不稳，提示后循环缺血或卒中，属急症。"
        ask: "晕的时候有没有耳鸣、听不清、恶心想吐，或者看东西重影、说话不清、手脚没力气？"
      - slot: history
        keywords: ["高血压", "糖尿病", "颈椎", "贫血", "吃什么药"]
        text: "需询问高血压、糖尿病、房颤、贫血、颈椎病、耳部疾病史，以及近期用药（降压药、镇静药、氨基糖苷类抗生素）。"
        ask: "以前有没有高血压、糖尿病、颈椎病或者耳朵的毛病？最近在吃什么药？"

  # ================================================================ 心悸
  - key: palp
    label: 心悸
    dept: 心内科
    keywords: ["心慌", "心悸", "心跳快", "心跳乱", "心脏跳", "心律不齐", "扑通"]
    slots: [nature, duration, trigger, companions, history]
    entries:
      - slot: nature
        keywords: ["性质", "快", "乱", "漏一拍", "什么感觉"]
        text: "心悸性质有助于判断心律失常类型：突发突止的规则快速心跳多为阵发性室上性心动过速；持续不规则、快慢不一多为心房颤动；心跳「漏一拍」或停顿感多为期前收缩。"
        ask: "心慌的时候感觉心跳是特别快、乱糟糟的不整齐，还是像漏了一拍？"
      - slot: duration
        keywords: ["多久", "几秒", "几分钟", "几小时"]
        text: "持续数秒至数分钟的短暂发作多为期前收缩或短阵室上速；持续数小时至数天不缓解需排除房颤、房扑；伴血流动力学不稳定（晕厥、胸痛、气短）时无论多久都属急症。"
        ask: "每次心慌持续多久？几秒钟、几分钟，还是好几个小时？"
      - slot: trigger
        keywords: ["诱因", "劳累", "咖啡", "紧张", "熬夜"]
        text: "运动、情绪激动、咖啡浓茶、饮酒、熬夜可诱发；静息状态下突发提示心律失常；晨起或夜间发作需注意自主神经张力变化。"
        ask: "心慌一般在什么情况下出现？劳累、紧张、喝了咖啡浓茶之后，还是安静待着也会？"
      - slot: companions
        keywords: ["伴随", "黑矇", "晕倒", "胸痛", "手抖", "出汗"]
        text: "伴黑矇、晕厥提示脑供血不足，需警惕恶性心律失常；伴胸痛提示心肌缺血；伴消瘦、多汗、手抖、怕热需排查甲状腺功能亢进；伴面色苍白、乏力需考虑贫血。"
        ask: "心慌的时候有没有眼前发黑、差点晕倒、胸口疼，或者特别怕热、手抖、体重下降？"
      - slot: history
        keywords: ["心脏病", "甲亢", "贫血", "吃什么药"]
        text: "既往心脏病、甲亢、贫血、焦虑病史，以及用药情况（甲状腺素、支气管扩张剂、含咖啡因药物）都会影响判断。"
        ask: "以前有没有心脏病、甲亢或者贫血？最近在吃什么药吗？"

  # ================================================================ 腹泻
  - key: diarrhea
    label: 腹泻
    dept: 消化内科
    keywords: ["拉肚子", "腹泻", "拉稀", "大便稀", "水样便", "一天拉", "闹肚子", "拉水"]
    slots: [nature, duration, pattern, companions, history]
    entries:
      - slot: nature
        keywords: ["性状", "什么样", "水样", "黏液", "血"]
        text: "大便性状是关键：水样便多为病毒性或产毒素细菌感染；黏液脓血便提示细菌性痢疾、溃疡性结肠炎、侵袭性大肠杆菌；糊状便伴油脂光泽提示吸收不良（胰腺外分泌不足）。"
        ask: "大便是什么样子的？稀水样、糊状，还是带黏液或者血？"
      - slot: duration
        keywords: ["多久", "几天", "几周"]
        text: "急性腹泻少于 2 周，多为感染或食物中毒；持续 2-4 周为迁延性；超过 4 周为慢性腹泻，需考虑肠易激综合征、炎症性肠病、乳糖不耐受、甲状腺功能亢进、药物因素。"
        ask: "拉肚子多久了？这两天刚开始，还是已经好几个星期了？"
      - slot: pattern
        keywords: ["几次", "次数", "夜里", "里急后重"]
        text: "每天次数和量决定脱水风险；夜间腹泻（夜里被憋醒排便）提示器质性疾病而非肠易激；餐后即刻腹泻提示胃结肠反射亢进；里急后重（想拉拉不出）提示直肠病变。"
        ask: "一天大概拉几次？晚上会不会被憋醒起来拉？"
      - slot: companions
        keywords: ["伴随", "发烧", "腹痛", "呕吐", "消瘦"]
        text: "伴发热、腹痛提示感染性肠炎；伴呕吐、无法进食提示脱水风险高；伴明显体重下降、贫血需排除炎症性肠病或肿瘤；伴皮疹、关节痛需考虑系统性疾病的肠道表现。"
        ask: "除了拉肚子，有没有发烧、肚子疼、呕吐，或者最近体重明显下降？"
      - slot: history
        keywords: ["吃了什么", "海鲜", "隔夜", "旅行", "抗生素"]
        text: "询问发病前饮食（生冷、海鲜、隔夜菜、集体就餐）、近期旅行、抗生素使用史（可致艰难梭菌感染）、基础疾病（糖尿病、甲亢、炎症性肠病）。"
        ask: "拉肚子之前有没有吃过什么特别的东西，比如海鲜、隔夜菜，或者在外面吃饭？"

  # ================================================================ 呕吐
  - key: vomit
    label: 呕吐
    dept: 消化内科
    keywords: ["呕吐", "吐了", "想吐", "干呕", "反胃", "吐出来", "恶心吐"]
    slots: [nature, pattern, duration, companions, history]
    entries:
      - slot: nature
        keywords: ["吐什么", "内容物", "胆汁", "咖啡", "血"]
        text: "呕吐物性质指向病变部位：胃内容物为胃源性；含胆汁提示梗阻在十二指肠乳头以下；咖啡样或鲜红色提示上消化道出血；粪臭样提示低位肠梗阻。"
        ask: "吐出来的是什么？是吃进去的食物、黄绿色的水，还是像咖啡渣一样的东西？"
      - slot: pattern
        keywords: ["几次", "什么时候吐", "早上", "吃完"]
        text: "晨起呕吐见于妊娠、颅内压增高、尿毒症；餐后即吐提示胃出口梗阻或功能性呕吐；喷射性呕吐不伴恶心提示颅内病变；呕吐后腹痛不缓解需警惕肠梗阻或胰腺炎。"
        ask: "吐了几次了？是吃完就吐，还是早上起来容易吐？吐之前会不会先觉得恶心？"
      - slot: duration
        keywords: ["多久", "几天"]
        text: "急性呕吐（少于 1 周）多为急性胃肠炎、食物中毒；反复发作数周以上需排除幽门梗阻、功能性呕吐、颅内病变。"
        ask: "这种情况持续多久了？是这两天才有，还是反复好几周了？"
      - slot: companions
        keywords: ["伴随", "腹痛", "腹泻", "头痛", "腹胀", "排气"]
        text: "伴腹痛腹泻提示胃肠炎；伴头痛、视物模糊提示颅内压增高；伴眩晕耳鸣提示前庭性；伴腹胀、停止排便排气需警惕肠梗阻；伴体重下降、贫血需排除肿瘤。"
        ask: "吐的时候有没有肚子疼、拉肚子、头疼，或者肚子胀、好几天没排便排气？"
      - slot: history
        keywords: ["月经", "用药", "糖尿病", "怀孕"]
        text: "询问育龄女性月经史（妊娠剧吐、异位妊娠）、近期用药（化疗药、止痛药、降糖药）、糖尿病史（胃轻瘫、酮症）、颅脑外伤或手术史。"
        ask: "最近月经正常吗？有没有在吃什么药，或者有糖尿病？"

  # ================================================================ 腰痛
  - key: back
    label: 腰痛
    dept: 骨科
    keywords: ["腰疼", "腰痛", "腰酸", "后背疼", "腰部", "闪了腰", "腰椎", "腰不舒服"]
    slots: [site, nature, duration, trigger, companions]
    entries:
      - slot: site
        keywords: ["部位", "哪边", "放射", "腿", "屁股"]
        text: "腰痛部位与放射：单侧腰部剧痛向腹股沟、会阴放射多为泌尿系结石；腰痛向一侧下肢后侧放射至足部提示腰椎间盘突出压迫坐骨神经；双侧腰痛伴发热提示肾盂肾炎；中线腰背痛伴晨僵需考虑强直性脊柱炎。"
        ask: "疼的位置在腰的哪一侧？会不会串到屁股或者腿上？"
      - slot: nature
        keywords: ["性质", "绞痛", "钝痛", "酸胀"]
        text: "绞痛（阵发性剧痛、辗转不安）提示结石；钝痛、酸胀多为肌肉劳损或腰椎退变；撕裂样痛需警惕主动脉夹层；夜间静息痛、进行性加重需排除脊柱肿瘤或感染。"
        ask: "是那种一阵阵绞着疼，还是酸酸胀胀的钝痛？"
      - slot: duration
        keywords: ["多久", "突然", "反复"]
        text: "急性腰痛少于 6 周多为机械性；持续超过 12 周为慢性腰痛；伴不明原因体重下降、发热、夜间痛、肿瘤病史者需警惕特异性腰痛（感染、肿瘤、骨折）。"
        ask: "腰疼多久了？是最近突然开始的，还是反反复复好几个月了？"
      - slot: trigger
        keywords: ["诱因", "搬东西", "扭", "久坐", "咳嗽", "休息"]
        text: "搬重物、扭腰、久坐后急性发作多为肌肉韧带损伤；咳嗽、打喷嚏、弯腰时加重提示椎间盘病变；卧床休息缓解支持机械性腰痛；休息不缓解、夜间加重提示炎症或肿瘤。"
        ask: "什么情况下会加重？弯腰、搬东西、咳嗽时疼不疼？躺下休息会好些吗？"
      - slot: companions
        keywords: ["伴随", "血尿", "发烧", "麻", "大小便"]
        text: "伴血尿、排尿疼痛提示结石或泌尿系感染；伴发热寒战提示感染；出现大小便失禁、鞍区（会阴）麻木、双下肢无力，是马尾综合征表现，需立即急诊评估。"
        ask: "有没有小便带血、发烧，或者腿麻没力气、大小便控制不住的情况？"

  # ================================================================ 关节痛
  - key: joint
    label: 关节痛
    dept: 风湿免疫科
    keywords: ["关节疼", "关节痛", "膝盖疼", "手腕疼", "手指疼", "脚趾疼", "关节肿", "痛风"]
    slots: [site, nature, duration, trigger, companions]
    entries:
      - slot: site
        keywords: ["哪个关节", "哪里", "对称", "两边"]
        text: "受累关节分布是鉴别的核心：第一跖趾关节突发红肿热痛高度提示痛风；双手近端指间关节、掌指关节对称性肿痛提示类风湿关节炎；膝、髋负重关节疼痛伴活动后加重提示骨关节炎；单关节急性红肿热痛需排除化脓性关节炎。"
        ask: "是哪个关节疼？手指、手腕、膝盖，还是大脚趾？是一边还是两边都有？"
      - slot: nature
        keywords: ["红肿", "发热", "晨僵", "僵硬", "肿"]
        text: "询问肿、热、红与晨僵：明显肿胀发热提示炎症性；晨僵超过 1 小时支持类风湿关节炎；晨僵短于 30 分钟多为退行性；游走性关节痛需考虑风湿热或病毒感染。"
        ask: "关节有没有红肿发热？早上起来会不会僵硬，要活动多久才能缓过来？"
      - slot: duration
        keywords: ["多久", "突然", "慢慢"]
        text: "急性单关节痛（数小时至数天）需优先排除感染与痛风；慢性对称性多关节痛（超过 6 周）支持类风湿；间歇发作、自行缓解者考虑痛风或反应性关节炎。"
        ask: "关节疼多久了？是突然一下就疼起来，还是慢慢加重的？"
      - slot: trigger
        keywords: ["诱因", "海鲜", "喝酒", "受凉", "活动"]
        text: "高嘌呤饮食、饮酒后发作提示痛风；受凉、潮湿、劳累后加重见于多种关节病；活动后加重、休息缓解提示机械性（骨关节炎）；休息后加重、活动后缓解提示炎症性。"
        ask: "疼之前有没有吃什么特别的东西，比如海鲜、动物内脏、喝酒？活动之后是更疼还是好些？"
      - slot: companions
        keywords: ["伴随", "发烧", "皮疹", "口腔溃疡", "眼睛", "腰背"]
        text: "伴发热、皮疹、口腔溃疡、脱发、光过敏提示系统性红斑狼疮；伴腰背痛、足跟痛、虹膜炎提示强直性脊柱炎；伴尿道炎、结膜炎提示反应性关节炎。"
        ask: "除了关节疼，有没有发烧、起疹子、口腔溃疡，或者眼睛发红、腰背僵硬？"

  # ================================================================ 皮疹
  - key: rash
    label: 皮疹
    dept: 皮肤科
    keywords: ["皮疹", "起疹子", "红疹", "痒", "起包", "风团", "水疱", "红斑", "荨麻疹", "起疙瘩"]
    slots: [nature, site, duration, trigger, companions]
    entries:
      - slot: nature
        keywords: ["什么样", "形态", "风团", "水疱", "紫癜", "痒不痒"]
        text: "皮疹形态是首要线索：风团（来去迅速、剧痒）为荨麻疹；斑丘疹多见于病毒疹或药疹；水疱呈带状单侧分布提示带状疱疹；紫癜（压之不褪色）提示血管炎或血小板减少，需紧急评估。"
        ask: "疹子长什么样？是红点、凸起的小疙瘩、水疱，还是一片片的风团？压一下会褪色吗？"
      - slot: site
        keywords: ["部位", "哪里", "分布", "先长"]
        text: "分布规律有诊断价值：从面部躯干向四肢蔓延见于麻疹；始发于耳后发际、向颈胸蔓延见于风疹；躯干密集、四肢较少见于幼儿急疹；沿神经节段单侧分布见于带状疱疹；暴露部位见于接触性皮炎。"
        ask: "疹子先从哪里长出来的？现在主要在哪些部位？是一边还是两边都有？"
      - slot: duration
        keywords: ["多久", "什么时候", "变多"]
        text: "记录出现时间、进展速度与是否瘙痒；数小时内迅速蔓延伴呼吸困难提示严重过敏反应（急症）；用药后 1-2 周出现的对称性皮疹需考虑药疹。"
        ask: "疹子是什么时候出现的？这几天有没有变大变多？痒得厉害吗？"
      - slot: trigger
        keywords: ["诱因", "新药", "食物", "接触", "蚊虫"]
        text: "询问发疹前用药（抗生素、解热镇痛药、抗癫痫药）、新食物、接触物（化妆品、金属、植物）、蚊虫叮咬、环境变化，这些直接指向病因。"
        ask: "起疹子之前有没有吃新药、吃特殊食物，或者接触过什么特别的东西？"
      - slot: companions
        keywords: ["伴随", "发烧", "肿", "呼吸困难", "嗓子紧"]
        text: "伴高热、紫癜、意识改变需警惕暴发性流脑或败血症；伴口唇眼睑肿胀、呼吸困难、声音嘶哑提示过敏性休克前兆，须立即急诊；伴关节痛、口腔溃疡提示系统性疾病。"
        ask: "起疹子的时候有没有发烧、嘴唇眼睛肿、喘不上气，或者嗓子发紧？"

  # ================================================================ 泌尿
  - key: urinary
    label: 泌尿不适
    dept: 泌尿外科
    keywords: ["尿频", "尿急", "尿痛", "血尿", "尿血", "小便疼", "尿不尽", "尿路", "尿浑浊", "起夜"]
    slots: [nature, duration, pattern, companions, history]
    entries:
      - slot: nature
        keywords: ["什么感觉", "尿痛", "血", "浑浊", "疼"]
        text: "尿路刺激征（尿频、尿急、尿痛）提示下尿路感染；肉眼血尿需区分全程血尿（膀胱以上）、终末血尿（膀胱颈或后尿道）、初始血尿（尿道）；尿液浑浊伴臭味提示感染。"
        ask: "主要是哪方面不舒服？是尿频尿急、尿的时候疼，还是尿里有血？"
      - slot: duration
        keywords: ["多久", "第一次", "反复"]
        text: "急性起病（数小时至数天）多为感染或结石；反复发作（每年 3 次以上）需排查解剖异常、结石、糖尿病等诱因；慢性病程伴排尿不畅需考虑前列腺增生或神经源性膀胱。"
        ask: "这些症状多久了？是第一次出现，还是以前也反复发作过？"
      - slot: pattern
        keywords: ["几次", "夜尿", "排尿困难", "顺畅"]
        text: "询问排尿次数、每次尿量、夜尿次数、是否有排尿困难或尿流中断；尿流中断伴疼痛提示膀胱结石；排尿末疼痛提示膀胱炎；全程排尿困难提示前列腺增生或尿道狭窄。"
        ask: "一天大概上几次厕所？晚上要起夜几次？尿的时候顺畅吗？"
      - slot: companions
        keywords: ["伴随", "腰痛", "发烧", "寒战", "绞痛"]
        text: "伴腰痛、高热寒战提示急性肾盂肾炎，需及时抗感染；伴一侧腰部绞痛放射至会阴提示输尿管结石；老年男性伴骨痛、消瘦需警惕前列腺肿瘤。"
        ask: "有没有发烧、腰痛，或者腰腹部一阵阵绞痛？"
      - slot: history
        keywords: ["结石", "糖尿病", "导尿", "憋尿"]
        text: "询问既往尿路感染、结石、糖尿病、前列腺疾病史，近期导尿或器械操作史，以及饮水量与憋尿习惯。"
        ask: "以前有过尿路感染或者结石吗？有没有糖尿病？"

  # ================================================================ 咽痛
  - key: throat
    label: 咽痛
    dept: 耳鼻喉科
    keywords: ["嗓子疼", "咽痛", "喉咙疼", "嗓子痛", "吞咽疼", "扁桃体", "喉咙痛", "嗓子哑"]
    slots: [nature, duration, companions, trigger, history]
    entries:
      - slot: nature
        keywords: ["程度", "咽口水", "吞咽", "能不能吃"]
        text: "咽痛程度与吞咽关系：能正常进食多为轻度；不敢吞咽口水、流涎提示扁桃体周围脓肿或急性会厌炎（急症）；单侧剧烈咽痛伴张口困难需紧急处理气道风险。"
        ask: "嗓子疼到什么程度？咽口水都疼吗？还能正常吃饭喝水吗？"
      - slot: duration
        keywords: ["多久", "几天", "越来越重"]
        text: "急性咽痛少于 1 周多为病毒性上呼吸道感染；持续 2 周以上单侧咽痛需排查扁桃体肿瘤；反复发作（每年 5 次以上）可考虑慢性扁桃体炎。"
        ask: "嗓子疼几天了？是一直疼还是越来越重？"
      - slot: companions
        keywords: ["伴随", "发烧", "鼻涕", "咳嗽", "疹子"]
        text: "伴发热、扁桃体化脓、颈部淋巴结肿大多为细菌性咽扁桃体炎；伴流涕、咳嗽、声嘶多为病毒感染；伴皮疹需考虑猩红热或传染性单核细胞增多症。"
        ask: "有没有发烧、流鼻涕、咳嗽，或者身上起疹子？"
      - slot: trigger
        keywords: ["诱因", "受凉", "熬夜", "感冒"]
        text: "询问发病前受凉、劳累、接触感冒患者；过敏原或干燥环境可引起咽部不适；胃食管反流可致慢性咽部异物感。"
        ask: "最近有没有受凉、熬夜，或者身边有人感冒？"
      - slot: history
        keywords: ["反复", "以前", "扁桃体"]
        text: "儿童与青少年需注意链球菌感染后风湿热风险；免疫功能低下者咽痛可能进展迅速。"
        ask: "以前有没有反复扁桃体发炎的情况？"

  # ================================================================ 儿童发热
  - key: child_fever
    label: 儿童发热
    dept: 儿科
    keywords: ["宝宝发烧", "宝宝发热", "孩子发烧", "孩子发热", "小孩发烧", "小孩发热",
               "婴儿发烧", "宝宝烧", "孩子烧", "几岁发烧", "小朋友发烧"]
    slots: [temperature, pattern, companions, duration, history]
    slot_hints:
      pattern: "烧几天了、退烧药能不能降下来"
    entries:
      - slot: temperature
        keywords: ["多少度", "几度", "多大"]
        text: "3 个月以下婴儿体温≥38℃ 属急症，需立即就医；3-6 个月≥39℃ 需及时就诊；发热高度本身不预测病情严重程度，精神状态更重要。"
        ask: "宝宝多大了？最高烧到多少度？"
      - slot: pattern
        keywords: ["几天", "退烧药", "降下来", "反复"]
        text: "热程与热型：持续高热、退热药效果差、发热超过 5 天需警惕川崎病（伴结膜充血、口唇皲裂、皮疹、手足硬肿）；热退疹出提示幼儿急疹。"
        ask: "烧了几天了？吃退烧药能降下来吗？降下来之后精神怎么样？"
      - slot: companions
        keywords: ["精神", "抽", "呼吸", "疹子", "吃奶", "尿量"]
        text: "危险信号：精神萎靡、嗜睡难唤醒、抽搐、呼吸急促或呻吟、皮肤花斑或紫癜、尿量明显减少、拒食拒水、囟门膨隆。出现任一表现立即急诊。"
        ask: "宝宝除了发烧，有没有精神很差、抽过筋、呼吸很急、身上起疹子，或者不肯吃奶喝水？"
      - slot: duration
        keywords: ["多久", "几天"]
        text: "发热持续时间是判断病因的重要维度：3 天内的急性发热多为病毒感染；超过 5 天需考虑细菌感染、川崎病、尿路感染等。"
        ask: "发烧是从哪天开始的？中间有没有完全退下去过？"
      - slot: history
        keywords: ["接触", "疫苗", "惊厥", "幼儿园"]
        text: "询问月龄、疫苗接种情况、近期接触史（幼儿园、手足口病接触）、既往热性惊厥史、基础疾病。"
        ask: "最近有没有接触过生病的小朋友？预防针都按时打了吗？"

  # ================================================================ 乏力 / 消瘦
  - key: fatigue
    label: 乏力
    dept: 全科医学科
    keywords: ["乏力", "没力气", "浑身没劲", "疲惫", "消瘦", "体重下降", "瘦了", "累", "没精神", "提不起劲"]
    slots: [duration, companions, history, pattern]
    entries:
      - slot: duration
        keywords: ["多久", "几周", "几个月"]
        text: "乏力病程：数天至数周多为急性感染、睡眠不足、情绪因素；持续超过 1 个月需系统排查贫血、甲状腺功能异常、糖尿病、慢性感染、肿瘤、抑郁。"
        ask: "这种没力气的感觉多久了？是最近几天，还是已经一两个月了？"
      - slot: companions
        keywords: ["伴随", "体重", "发烧", "出汗", "怕冷", "怕热", "苍白"]
        text: "伴体重下降需量化（半年内下降超过 10% 有临床意义）；伴发热盗汗提示结核或淋巴瘤；伴怕冷怕热、心慌手抖提示甲状腺疾病；伴面色苍白提示贫血；伴情绪低落、兴趣减退提示抑郁。"
        ask: "这段时间体重有没有下降？大概降了多少斤？有没有发烧或者晚上出汗？"
      - slot: history
        keywords: ["吃饭", "睡觉", "压力", "月经", "慢性病"]
        text: "询问饮食、睡眠、工作压力、女性月经情况、慢性病史与近期用药；老年人新发乏力需警惕感染、贫血、心衰、肾功能不全。"
        ask: "最近吃饭睡觉怎么样？工作生活上压力大吗？"
      - slot: pattern
        keywords: ["规律", "休息", "一直", "一阵一阵"]
        text: "晨起加重、休息不缓解见于抑郁或慢性疲劳；活动后加重、休息缓解提示心肺或代谢性原因；波动性与情绪相关提示功能性。"
        ask: "这种累是一直都有，还是一阵一阵的？休息之后能缓过来吗？"

  # ================================================================ 情绪 / 睡眠
  - key: mood
    label: 情绪睡眠
    dept: 精神心理科
    keywords: ["睡不着", "失眠", "早醒", "情绪低落", "抑郁", "焦虑", "心情不好", "没兴趣",
               "想哭", "压力大", "烦躁", "不想活"]
    slots: [duration, nature, companions, pattern, history]
    entries:
      - slot: duration
        keywords: ["多久", "几周", "几个月"]
        text: "抑郁发作需情绪低落或兴趣减退持续 2 周以上，且影响社会功能；短暂的情绪波动属正常应激反应。"
        ask: "心情不好持续多久了？是这两周一直这样，还是偶尔才有？"
      - slot: nature
        keywords: ["兴趣", "低落", "自杀", "伤害自己", "念头"]
        text: "核心症状：持续情绪低落、对以前喜欢的事失去兴趣、精力下降、自我评价低、注意力不集中、睡眠与食欲改变、反复想到死亡。存在自杀意念必须直接询问并转介精神心理科。"
        ask: "这段时间有没有觉得做什么都提不起兴趣？有没有出现过不想活、或者想伤害自己的念头？"
      - slot: companions
        keywords: ["睡眠", "胃口", "体重", "心慌", "头痛"]
        text: "伴随的躯体症状：入睡困难或早醒（早醒更具提示性）、食欲与体重变化、头痛、胃肠不适、心慌；需排除甲减、贫血等躯体疾病导致的情绪症状。"
        ask: "睡眠怎么样？是睡不着、容易醒，还是睡得特别多？胃口有变化吗？"
      - slot: pattern
        keywords: ["早上", "晚上", "什么时候最差", "规律"]
        text: "昼夜节律：晨重暮轻（早晨情绪最差、傍晚好转）是内源性抑郁的典型特征；与月经周期相关提示经前情绪障碍；季节性发作提示季节性情感障碍。"
        ask: "一天里什么时候心情最差？早上还是晚上？"
      - slot: history
        keywords: ["以前", "家族", "治疗", "生活事件"]
        text: "询问既往发作史、家族史、重大生活事件（丧亲、失业、疾病）、物质使用（酒精、镇静药），以及目前是否在接受治疗。"
        ask: "以前有没有类似情况？家里人有这方面的困扰吗？"

  # ================================================================ 妇科下腹痛 / 出血
  - key: gyn
    label: 妇科
    dept: 妇产科
    keywords: ["小肚子疼", "小腹痛", "下腹痛", "小腹疼", "阴道出血", "出血", "月经",
               "白带", "痛经", "例假", "大姨妈", "停经", "妇科", "附件"]
    slots: [site, nature, history, companions, duration]
    slot_hints:
      history: "末次月经时间、周期是否规律、有无停经"
    entries:
      - slot: site
        keywords: ["位置", "哪边", "一侧", "肛门"]
        text: "下腹痛定位：单侧下腹剧痛需排除异位妊娠、卵巢囊肿蒂扭转、附件炎；正中下腹坠痛多见于痛经、子宫内膜炎；疼痛放射至肛门提示盆腔积液或子宫内膜异位症。"
        ask: "疼的位置在小腹的哪一侧？会不会串到肛门或者大腿？"
      - slot: nature
        keywords: ["性质", "持续", "突然", "撕裂", "周期"]
        text: "持续性钝痛多为炎症；突发撕裂样剧痛提示囊肿破裂或异位妊娠破裂（可致失血性休克，属急症）；周期性疼痛与月经相关多为痛经或子宫内膜异位症。"
        ask: "是持续地疼，还是突然一下剧痛？跟月经周期有关系吗？"
      - slot: history
        keywords: ["月经", "停经", "末次", "避孕"]
        text: "必须询问末次月经时间、周期是否规律、有无停经史、性生活史与避孕方式。育龄女性腹痛伴停经、阴道出血，必须首先排除异位妊娠。"
        ask: "最近一次月经是什么时候来的？这次月经量和平时一样吗？"
      - slot: companions
        keywords: ["出血", "晕", "发热", "白带", "恶心"]
        text: "伴阴道出血、晕厥、肛门坠胀感提示腹腔内出血，需立即急诊；伴发热、脓性白带提示盆腔炎；伴恶心呕吐需与胃肠疾病鉴别。"
        ask: "有没有阴道出血？有没有头晕、想晕倒的感觉？"
      - slot: duration
        keywords: ["多久", "以前", "反复"]
        text: "急性发作（数小时内）优先排除妇科急症；慢性反复发作（超过 6 个月）多为子宫内膜异位症、慢性盆腔炎。"
        ask: "这次疼了多久了？以前有没有类似发作？"

  # ================================================================ 兜底域
  - key: general
    label: 一般不适
    dept: 全科医学科
    keywords: []
    slots: [site, nature, duration, companions]
    entries:
      - slot: site
        keywords: ["部位", "哪里", "不舒服"]
        text: "患者主诉模糊时，先定位：具体是哪个部位不舒服，是局部还是全身性的。定位不清时常需要配合伴随症状一起判断。"
        ask: "主要是哪个部位不舒服？能具体指一下吗？"
      - slot: nature
        keywords: ["感觉", "什么样", "怎么不舒服"]
        text: "把模糊的「不舒服」转化为可描述的性质：疼、胀、闷、痒、麻、烧灼、无力，不同性质指向不同系统。"
        ask: "是怎么个不舒服法？是疼、胀、发闷，还是没力气？"
      - slot: duration
        keywords: ["多久", "什么时候"]
        text: "起病时间是分层风险最基本的一维：突然发生的多需排除急症，长期慢性的更偏向慢性病或功能性问题。"
        ask: "这种不舒服是从什么时候开始的？"
      - slot: companions
        keywords: ["伴随", "还有", "其他"]
        text: "模糊主诉常伴被忽略的伴随症状，系统性问一遍往往能定位：发热、体重变化、食欲睡眠、大小便、皮疹。"
        ask: "除了这个，还有没有别的不舒服？比如发烧、吃不下、睡不好，或者大小便的变化？"
