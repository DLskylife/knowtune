# 预问诊运行时参数（后台「前台站点 → 预问诊参数」维护）。
#
# 这里只记「和 config/previsit.yaml 不一样」的键，默认值仍以那份文件为准。
# 想把某一项改回出厂值：在界面上改回去保存，或者直接删掉对应的行。
# 手改也有效，下次保存时会被整理成同样的格式。
#
# 不写密钥：密钥在后台「模型」页填一次，预问诊跟着用，不落在这个文件里。
#
# 模型一律跟随「模型服务」页的固定入口 /v1，这里不再钉后端 / 模型名。
# 以前钉的 lmstudio::qwen2.5-3b-doctor-merged 在配置推倒重来后已不存在，
# 留着只会让网关回 400、整场问诊悄悄退回规则兜底。
