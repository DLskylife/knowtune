# 提示词覆盖层。由后台「模型 → 提示词」维护，也可手改。
# 只记录与内置默认不同的字段：删掉某一行 = 该项回到内置默认。
# 内置默认在 config/prompts/*.md（generate）和 knowtune/promptcfg.py（translate），
# 本文件永远不覆盖它们，因此「恢复默认」是安全的。
# 解析顺序（与 promptcfg.effective_fields() 一致）：
# by_provider.<后端> → by_scope.<板块> → default（角色默认）→ 内置 → 兜底。
# 仅 generate / translate 支持 by_provider 与 by_scope 两层。

prompts:
  translate:
    by_provider:
      siliconflow:
        system: 你是翻译器。用户输入一句话，如果是维吾尔语翻译为中文，如果是中文翻译成维吾尔语。
  copy_zh:
    default:
      samples: '维医中的四种体液是什么？

        气质有哪些分类？

        维医如何治疗贫血？'
