<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>智能预问诊 · KnowTune</title>
<!-- 相对路径：同一份页面既能独立跑在 /，也能挂在前台站点的 /previsit/ 下 -->
<link rel="stylesheet" href="static/style.css?v=0.3.0">
<link rel="icon" href="data:,">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">＋</span>
      <div class="brand-text">
        <h1 id="pvTitle">智能预问诊</h1>
        <p id="pvSubtitle">结构化采集症状，给出就诊科室建议 · 不构成诊断<span class="live" aria-hidden="true"><i></i>在线</span></p>
      </div>
    </div>
    <div class="top-actions">
      <button class="ghost" id="btnBack" type="button" hidden>补充基本信息</button>
      <button class="ghost" id="btnRestart" type="button">重新开始</button>
    </div>
  </header>

  <div class="layout">
    <div class="stage">

      <!-- ==================== 视图一：基本信息（可跳过） ==================== -->
      <section class="view intake-view" id="intakeView">
        <div class="intake-head">
          <h2>开始前，先填一下基本信息</h2>
          <p>这些信息会作为整场问诊的上下文：已经填过的，系统不会再问一遍，并且会直接写进最后的病历。哪里不舒服不用在这里写——开始后第一句就会问，边说边整理。<b>不想填可以直接跳过</b>，问诊中途随时能回来补。</p>
        </div>

        <form class="form" id="intakeForm" autocomplete="off" novalidate>
          <div class="form-grid" id="formGrid"></div>

          <p class="form-error" id="formError" role="alert" hidden></p>

          <div class="form-foot">
            <button type="submit" class="primary" id="btnStart">开始问诊</button>
            <button type="button" class="ghost" id="btnSkip">跳过，直接开始</button>
            <span class="form-note" id="formNote">带 <span class="req">*</span> 的必填。信息只存在本机。</span>
          </div>
        </form>

        <p class="disclaimer bottom" id="disclaimerTop"></p>
      </section>

      <!-- ==================== 视图二：问诊对话 ==================== -->
      <section class="view chat-view" id="chatView" hidden>
        <!-- 进度线：档案填了几项，顶上看一眼就知道还要问多久。
             细到 2px，不做成进度条——它是节奏提示，不是任务条。 -->
        <div class="pv-progress" aria-hidden="true"><i id="pvProgress"></i></div>
        <div class="pv-coverage" id="coverageBar">
          <span class="cov-main" id="coverageText">档案采集 0/0 项</span>
          <span class="cov-miss" id="profileMissing" hidden></span>
          <button type="button" class="link-btn" id="btnEditProfile">补充基本信息</button>
        </div>
        <div class="thread" id="thread" aria-live="polite"></div>
        <div class="composer">
          <textarea id="input" rows="1" placeholder="描述一下哪里不舒服" autocomplete="off"></textarea>
          <button id="send" class="primary" type="button">发送</button>
        </div>
        <p class="hint" id="hint">按 Enter 发送，Shift + Enter 换行</p>
      </section>

      <!-- ==================== 视图三：结果页 ==================== -->
      <section class="view result-view" id="resultView" hidden>
        <div class="rv-head">
          <div>
            <h2 id="rvTitle">问诊已完成</h2>
            <p id="rvSub">下面是整理好的就诊摘要，可编辑、复制或下载带去给医生。</p>
          </div>
          <div class="rv-actions">
            <button type="button" class="ghost" id="btnSupplement">继续补充</button>
            <button type="button" class="ghost" id="btnRestart2">重新开始</button>
          </div>
        </div>

        <div class="rv-triage card" id="rvTriage"></div>
        <div class="rv-meta" id="rvMeta"></div>

        <div class="rv-sheet card">
          <div class="rv-sheet-head">
            <h3 id="rvRecordTitle">预问诊病历</h3>
            <div class="rv-tools">
              <button type="button" data-act="edit">编辑</button>
              <button type="button" data-act="copy">复制</button>
              <button type="button" data-act="txt">下载 .txt</button>
              <button type="button" data-act="md">下载 .md</button>
            </div>
          </div>
          <div id="rvBody"></div>
          <textarea id="recordEdit" rows="18" hidden spellcheck="false"></textarea>
          <div class="rv-edit-foot" id="rvEditFoot" hidden>
            <button type="button" class="primary" id="btnSaveRecord">保存修改</button>
            <button type="button" class="ghost" id="btnCancelRecord">取消</button>
            <span class="rv-saved" id="recordSaved"></span>
          </div>
          <p class="rv-note" id="rvNote"></p>
        </div>

        <details class="rv-turns">
          <summary>患者原话记录（给医生核对信息用）</summary>
          <div id="rvTurns"></div>
        </details>

        <p class="disclaimer" id="rvDisclaimer"></p>
      </section>

    </div>

    <aside class="side">
      <section class="card" id="profileCard" hidden>
        <h2>基本信息</h2>
        <div class="record compact" id="profileList"></div>
      </section>

      <section class="card">
        <h2>问诊档案 <span class="tag" id="domainTag" hidden></span> <span class="count" id="slotCount"></span></h2>
        <div class="record" id="record"></div>
      </section>

      <section class="card result-card" id="resultCard" hidden>
        <h2>分诊建议</h2>
        <div id="result"></div>
      </section>

      <p class="disclaimer" id="disclaimer"></p>
    </aside>
  </div>
</div>
<script src="static/app.js?v=0.3.0"></script>
</body>
</html>
