<!DOCTYPE html>
<html lang="ug" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ئۇيغۇر تېبابىتى بىلىم سوئال-جاۋاب سىستېمىسى</title>
<link rel="stylesheet" href="/style.css?v=1.7.46">
<link rel="icon" href="data:,">
<script>
  /*
   * 构建号自检。HTML 是 no-store 的，但 WebView 仍可能把旧的 app.js 留在缓存里，
   * 于是出现"HTML 新、JS 旧"：按钮按新版渲染出来了，事件却是旧 JS 绑的（或根本
   * 没绑）——表现就是"按钮在，点了没反应"。这里用页面里这份**一定是新的**编号去
   * 核对 app.js 报上来的编号，对不上就强制换一次。只换一次（sessionStorage 记
   * 一笔），免得极端情况下刷成死循环。
   */
  window.SITE_REQ_BUILD = "1.7.46";
  addEventListener("load", function () {
    if (window.SITE_BUILD === window.SITE_REQ_BUILD) return;
    if (sessionStorage.getItem("knowtune.site.reloaded")) return;
    sessionStorage.setItem("knowtune.site.reloaded", "1");
    location.replace(location.pathname + "?cb=" + Date.now());
  });
</script>
</head>
<body>
<div class="app">

  <!-- 左侧栏：品牌 + 新对话 + 板块 + 历史 + 语言。
       位置永远在左，切语言也不动——镜像整页会让所有元素换边，用户点完
       语言开关就找不到刚才那个按钮了。 -->
  <aside class="side" id="side" aria-label="导航">
    <div class="side-head">
      <!-- 品牌徽记：内联 SVG 的一片叶子（一撇叶脉 + 一笔叶缘），不引外部图片，
           离线下也不会变成碎图标。此前是两个旋转方块叠八角星——在 28px 下
           1.4px 的描边糊成一团白点，缩到侧栏尺寸就只剩个方块。 -->
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4.6 19.4C4.6 11 9.6 5.6 19.8 4.2c-1 10.2-6.4 15.2-15.2 15.2Z"/><path d="M4.6 19.4c3.4-5.4 7.8-9.4 13.6-13.2"/></svg>
      </span>
      <div class="side-id">
        <p class="side-name" id="sideName" dir="auto"></p>
        <p class="side-meta" id="sideMeta" dir="ltr"></p>
      </div>
    </div>

    <!-- 新对话：整栏一颗通栏按钮，和参考界面同一个位置、同一个分量。
         以前藏在「对话」标题行的一个小加号里——三栏并排之后，那颗加号
         跟板块导航抢层级，用户找新对话得先找标题行。 -->
    <button class="new-chat" id="btnNewChat" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span id="newChatLabel"></span>
    </button>

    <!-- 三个板块：维医问答 / 古籍问答 / 预问诊。
         前两个是同一套问答、只是检索范围不同（维医库 vs 古籍），所以它们
         共用一个会话列表；预问诊是另一条链路，进去就没有"对话历史"可列。 -->
    <nav class="nav" id="nav" aria-label="板块"></nav>

    <div class="side-hist" id="sideHist">
      <div class="hist-head">
        <span id="histTitle"></span>
      </div>
      <div class="side-scroll" id="sideScroll"></div>
    </div>

    <!-- 语言开关放在侧栏底部（参考界面是账号行的位置）。
         两颗并排按钮 + 当前语言高亮：比一颗"点了会变成X"的按钮清楚得多。
         位置固定，不随界面语言换边。 -->
    <div class="side-foot">
      <div class="lang-switch" id="langSwitch" role="group" aria-label="语言"></div>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <div class="main" id="main">
    <!-- 顶栏只在对话态出现一个居中胶囊（现在在哪一栏）。空态整条是透明的，
         菜单键浮在左上——参考界面的首屏没有标题栏，欢迎语才是第一眼。 -->
    <header class="top">
      <button class="icon-btn only-narrow" id="btnSide" type="button" aria-label="menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="top-id">
        <h1 id="siteTitle" dir="auto"></h1>
        <p class="sub" id="siteSub" dir="auto" hidden></p>
      </div>
    </header>

    <main class="chat" id="chat">
      <div class="welcome" id="welcome" hidden>
        <div class="wel-wrap">
          <span class="brand-mark wel-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4.6 19.4C4.6 11 9.6 5.6 19.8 4.2c-1 10.2-6.4 15.2-15.2 15.2Z"/><path d="M4.6 19.4c3.4-5.4 7.8-9.4 13.6-13.2"/></svg>
          </span>
          <h2 class="wel-text" id="welText" dir="auto"></h2>
        </div>
        <p class="wel-hint" id="welHint" dir="auto"></p>
      </div>
      <div class="msgs" id="msgs"></div>
      <!-- 预问诊用同一个聊天区、同一套气泡与输入框，只是把消息画在这里。
           两块列表分开是为了切板块时不互相冲掉。 -->
      <div class="msgs" id="pvMsgs" hidden></div>
    </main>

    <!-- 用户往上翻看旧答案时，新内容不该把他拽回底部。这个按钮只在
         "已经不在底部"时出现，点一下回到底部并恢复自动跟随。 -->
    <button class="to-bottom" id="toBottom" type="button" hidden>
      <span class="arrow" aria-hidden="true">↓</span><span id="toBottomLabel"></span>
    </button>

    <footer class="composer">
      <div class="status" id="status" hidden></div>
      <div class="box">
        <!-- dir=auto：输维吾尔语自动按 RTL 排，输中文自动按 LTR 排 -->
        <textarea id="q" rows="1" dir="auto" autocomplete="off" spellcheck="false"></textarea>
        <div class="box-foot">
          <!-- 只陈述事实：资料是什么语言、答案是什么语言。它不是按钮，
               放这里是告诉用户"为什么答案有时来得慢"。 -->
          <span class="tool" id="toolChip"></span>
          <!-- 维语输入：中文电脑没有维吾尔语键盘，患者端也可能只有触屏。
               点开就是一张字母表 + 拉丁转写——不装输入法也能提一个维语问题。 -->
          <button class="kb-btn" id="btnKb" type="button" aria-expanded="false"
                  aria-controls="kb">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2.5" y="6" width="19" height="12" rx="3"/>
              <path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M7 14h10"/>
            </svg>
            <span id="kbBtnLabel"></span>
          </button>
          <span class="grow"></span>
          <button class="send" id="btnSend" type="button" disabled>
            <svg class="ico-send" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/>
            </svg>
            <svg class="ico-stop" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="7" y="7" width="10" height="10" rx="2.5"/>
            </svg>
            <span class="sr-only" id="sendLabel"></span>
          </button>
        </div>

        <!-- 维语输入面板：上半是拉丁转写（会打拼音就会用），下半是字母表
             （触屏、或者完全不会拉丁转写时用）。面板浮在输入框上方，不挤压
             聊天区——展开时输入框不跳，用户的眼睛不用重新找位置。 -->
        <div class="kb" id="kb" hidden>
          <div class="kb-head">
            <b id="kbTitle"></b>
            <span class="grow"></span>
            <button class="kb-x" id="kbClose" type="button" aria-label="close">×</button>
          </div>
          <p class="kb-tip" id="kbTip" dir="auto"></p>
          <div class="kb-lat">
            <input id="kbLat" class="kb-input" type="text" dir="ltr"
                   autocomplete="off" spellcheck="false">
            <span class="kb-prev" id="kbPrev" dir="rtl"></span>
            <button class="kb-ins" id="kbIns" type="button"></button>
          </div>
          <div class="kb-keys" id="kbKeys"></div>
          <div class="kb-foot">
            <button class="kb-key kb-key-extra" type="button" data-ins="ئ">ئ</button>
            <button class="kb-key kb-space" id="kbSpace" type="button" data-ins=" "></button>
            <button class="kb-key kb-key-extra" id="kbDel" type="button">⌫</button>
          </div>
        </div>
      </div>
      <!-- 示例问题放在输入框下方、只在空态出现：参考界面首屏只有欢迎语和输入框，
           示例是给"不知道该问什么"的患者的辅助，不该挡在输入框前面，
           也不该被免责声明隔开、掉到页面最底下。 -->
      <div class="samples" id="samples"></div>
      <p class="disclaimer" id="disclaimer" dir="auto"></p>
    </footer>
  </div>
</div>
<script src="/app.js?v=1.7.46"></script>
</body>
</html>
