# ---------------------------------------------------------------- 合规词表（正则）
# 生成的话术命中任意一条，就被判定违规，退化成安全模板。
forbidden:
  - "确诊"
  - "诊断为"
  - "您得的是"
  - "可以吃.{0,6}药"
  - "建议服用"
  - "阿莫西林"
  - "头孢"
  - "抗生素"
  - "处方"
  - "不用去医院"
  - "没事的"
  - "保证"

# ---------------------------------------------------------------- 追问知识库
# 知识库不在这里 —— 见 config/previsit_kb.yaml。
#
# 那份文件按「症状域 × 槽位」组织：每个域声明要问哪些槽位，每个槽位配
# 「知识点（喂给模型的小抄）+ 现成问法（模型不可用时直接用）」。
# 加一个症状域、改一句问法，都只动那个文件，不用碰这里，更不用改代码。

# ---------------------------------------------------------------- 提示词
# 占位符用单花括号，缺字段时原样保留，不会报错。
prompts:
  extract: |
    你是医疗预问诊的信息抽取器。请从患者这句话里抽取症状信息，只输出一个 JSON 对象，不要任何解释、不要 markdown 代码块。
    输出必须紧凑：单行、键值之间不要空格和换行（每个字段短，紧凑输出比带缩进的体积小一半以上，患者等待时间明显更短）。
    需要抽取的字段：{fields}。
    - 患者没提到的字段填 null；多值字段（{multi_fields}）没提到填 []。
    - 只抽取患者明确说过的内容，不要推测、不要补充。
  ask: |
    你是预问诊助手。已知患者信息：{known}。基本情况：{profile}。
    这一步需要了解的是「{label}」（{hint}）。
    参考要点：{tips}
    推荐问法：{ask}
    {retry}
    请用一句温柔、口语化的中文，向患者提一个问题来了解「{label}」。要求：
    - 只输出这一句话，不要解释、不要列点；
    - 推荐问法如果已经合适，可以基本照用，只做口语化微调；
    - 绝对不能下诊断、不能判断病情轻重、不能推荐任何药物；
    - 可以给一两个选项帮患者理解，但只问一个问题。
  report: |
    你是预问诊助手。请根据下面的结构化信息，写一段通顺的中文就诊摘要，不超过 120 字：
    {known}
    建议就诊科室：{dept}，{urgency}。
    要求：
    - 只做信息整理和复述，绝对不能下诊断、不能开药、不能判断病情；
    - 最后一句必须是「以上信息由 AI 辅助整理，请以医生面诊为准」；
    - 只输出这段文字，不要标题、不要列表。
# ---------------------------------------------------------------- 病历
# 问诊收网后生成的结构化病历。分区顺序即展示顺序。
# key 对应代码里算好的分区（basic/chief/present/past/triage/summary），
# 想少显示一区就从这里删掉；想改叫法就改 label。
record:
  title: "预问诊病历"
  sections:
    - {key: basic,   label: "基本信息"}
    - {key: chief,   label: "主诉"}
    - {key: present, label: "现病史"}
    - {key: past,    label: "既往史 / 过敏 / 用药"}
    - {key: triage,  label: "分诊建议"}
    - {key: summary, label: "就诊摘要"}
  # 病历末尾的固定提示，不经过大模型
  note: "本简历由 AI 辅助整理，仅用于就诊前信息汇总，不构成诊断或治疗建议；最终以医生面诊为准。"
